# ============================================================================
#  gestion-alquileres :: configuracion de la aplicacion
#  Todos los valores admiten sobrescritura por variable de entorno, que es lo
#  que hace docker-compose. Sintaxis: ${VARIABLE:valor por defecto}
# ============================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: gestion-alquileres

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alquileres}
    username: ${SPRING_DATASOURCE_USERNAME:alquileres}
    password: ${SPRING_DATASOURCE_PASSWORD:alquileres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 20000

  jpa:
    # El esquema lo crea Flyway; Hibernate solo comprueba que coincide.
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Madrid
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  # Servidor SMTP para los avisos de caducidad de contrasena.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    encoding: UTF-8

# ---------------------------------------------------------------------------
# Parametros funcionales propios
# ---------------------------------------------------------------------------
app:
  usuario-sistema:
    # Cuenta tecnica que se garantiza en cada arranque. Nunca caduca.
    password: ${SYSTEM_PASSWORD:system}
    email: ${SYSTEM_EMAIL:system@gestion-alquileres.local}
  password:
    dias-validez: ${PASSWORD_DIAS_VALIDEZ:90}
    dias-preaviso: ${PASSWORD_DIAS_PREAVISO:7}
    # Revision diaria de contrasenas caducadas (segundo minuto hora dia mes dia-semana)
    cron-revision: ${PASSWORD_CRON:0 0 7 * * *}
  correo:
    habilitado: ${CORREO_HABILITADO:true}
    remitente: ${CORREO_REMITENTE:no-reply@gestion-alquileres.local}
    copia-administrador: ${CORREO_COPIA_ADMIN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.gestion.alquileres: ${LOG_LEVEL_APP:INFO}
    org.flywaydb: INFO

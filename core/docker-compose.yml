# =============================================================================
#  gestion-alquileres :: entorno completo
#    postgres  -> base de datos (el esquema lo crea Flyway al arrancar la app)
#    app       -> aplicacion Spring Boot (modulo web-front)
#    mailhog   -> servidor SMTP de pruebas para ver los avisos de caducidad
#    adminer   -> cliente web de base de datos (perfil "herramientas")
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: alquileres-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alquileres}
      POSTGRES_USER: ${POSTGRES_USER:-alquileres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alquileres}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan SOLO la primera vez que se crea
      # el volumen; sirven para dejar datos de ejemplo cargados de inicio.
      - ./db/inicializacion:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alquileres} -d ${POSTGRES_DB:-alquileres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [alquileres]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion-alquileres:1.0.0
    container_name: alquileres-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alquileres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-alquileres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-alquileres}
      # Cuenta tecnica que se garantiza en cada arranque (no caduca nunca)
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD:-system}
      SYSTEM_EMAIL: ${SYSTEM_EMAIL:-system@gestion-alquileres.local}
      # Correo de avisos de caducidad
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-reply@gestion-alquileres.local}
      PASSWORD_DIAS_VALIDEZ: ${PASSWORD_DIAS_VALIDEZ:-90}
      TZ: Europe/Madrid
    ports:
      - "${APP_PORT:-8080}:8080"
    networks: [alquileres]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: alquileres-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"   # interfaz web para leer los correos
    networks: [alquileres]

  adminer:
    image: adminer:4
    container_name: alquileres-adminer
    restart: unless-stopped
    depends_on: [postgres]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    profiles: [herramientas]
    networks: [alquileres]

volumes:
  datos-postgres:

networks:
  alquileres:
    driver: bridge
